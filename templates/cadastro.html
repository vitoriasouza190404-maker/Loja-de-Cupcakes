
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Loja de Cupcakes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>🧁 Criar minha conta</h1>
        <p>Cadastre-se para comprar nossos cupcakes!</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastro de cliente</h2>

            {% for mensagem in get_flashed_messages() %}
                <p role="alert">{{ mensagem }}</p>
            {% endfor %}

            <form method="POST">
                <label for="nome">Nome completo</label>
                <input
                    id="nome"
                    name="nome"
                    type="text"
                    required
                    maxlength="120"
                    autocomplete="name"
                    value="{{ nome | default('') }}"
                >

                <label for="email">E-mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                    value="{{ email | default('') }}"
                >

                <label for="senha">Senha</label>
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
                <p>A senha deve conter pelo menos 8 caracteres.</p>

                <label for="confirmar_senha">Confirmar senha</label>
                <input
                    id="confirmar_senha"
                    name="confirmar_senha"
                    type="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

                <button type="submit">Criar conta</button>
            </form>

            <p>
                Já tem uma conta?
                <a href="{{ url_for('login') }}">Entrar</a>
            </p>

            <a href="{{ url_for('pagina_inicial') }}">
                Voltar à loja
            </a>
        </section>
    </main>
</body>
</html>
